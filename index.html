<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine-Cutie | AI Movie Agent</title>
  <link rel="stylesheet" href="/src/css/base.css">
  <link rel="stylesheet" href="/src/css/animations.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/pipeline.css">
  <link rel="stylesheet" href="/src/css/responsive.css">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-controls">
      <button id="settingsBtn" class="icon-btn" title="AI Settings">⚙️<span class="llm-dot" id="llmDot"></span></button>
      <button id="themeToggle" class="icon-btn" title="Toggle theme">🌙</button>
      <button id="langToggle" class="icon-btn" title="Switch language">中</button>
    </div>
    <div class="mascot-wrap">
      <div class="mascot" id="mascot">
        <div class="mascot-body">
          <div class="mascot-lens"></div>
          <div class="mascot-eye left"></div>
          <div class="mascot-eye right"></div>
          <div class="mascot-cheek left"></div>
          <div class="mascot-cheek right"></div>
          <div class="mascot-mouth"></div>
        </div>
        <div class="mascot-reel left"></div>
        <div class="mascot-reel right"></div>
        <div class="mascot-leg left"></div>
        <div class="mascot-leg right"></div>
      </div>
    </div>
    <h1 class="title">Cine-Cutie</h1>
    <p class="subtitle">Your AI Movie Creation Agent</p>
  </header>

  <!-- Input Section -->
  <div class="section" id="inputSection">
    <div class="section-title"><span class="icon">🎬</span> Tell me your story idea</div>
    <div class="input-area">
      <textarea id="userInput" placeholder="One sentence, a paragraph, or a wild idea — anything that sparks your imagination...&#10;&#10;e.g. &quot;A shy librarian discovers she can enter books and meet their characters&quot;"></textarea>
      <div class="duration-row">
        <label for="totalDuration" id="lblDuration">视频总时长（秒）</label>
        <div class="duration-input-wrap">
          <input type="number" id="totalDuration" value="30" min="5" max="120" step="5">
          <span class="duration-hint" id="durationHint">每个片段约 5 秒，将生成 6 个镜头</span>
        </div>
      </div>
      <div class="aspect-row">
        <label id="lblAspectRatio">画面比例</label>
        <div class="aspect-options">
          <button class="aspect-btn active" data-ratio="16:9" data-size="1280*720" title="16:9">
            <span class="ratio-shape" style="width:28px;height:16px"></span>
            <span class="ratio-label">16:9</span>
          </button>
          <button class="aspect-btn" data-ratio="9:16" data-size="720*1280" title="9:16">
            <span class="ratio-shape" style="width:14px;height:25px"></span>
            <span class="ratio-label">9:16</span>
          </button>
          <button class="aspect-btn" data-ratio="1:1" data-size="1024*1024" title="1:1">
            <span class="ratio-shape" style="width:20px;height:20px"></span>
            <span class="ratio-label">1:1</span>
          </button>
          <button class="aspect-btn" data-ratio="4:3" data-size="1024*768" title="4:3">
            <span class="ratio-shape" style="width:24px;height:18px"></span>
            <span class="ratio-label">4:3</span>
          </button>
          <button class="aspect-btn" data-ratio="3:4" data-size="768*1024" title="3:4">
            <span class="ratio-shape" style="width:18px;height:24px"></span>
            <span class="ratio-label">3:4</span>
          </button>
          <button class="aspect-btn" data-ratio="21:9" data-size="1344*576" title="21:9">
            <span class="ratio-shape" style="width:32px;height:12px"></span>
            <span class="ratio-label">21:9</span>
          </button>
        </div>
      </div>
      <div class="resolution-row">
        <label id="lblResolution">分辨率</label>
        <div class="res-options">
          <button class="res-btn" data-res="480P">480P</button>
          <button class="res-btn active" data-res="720P">720P</button>
          <button class="res-btn" data-res="1080P">1080P</button>
        </div>
      </div>
      <div class="style-row">
        <label id="lblVisualStyle">视觉风格</label>
        <div class="style-options" id="styleOptions">
          <button class="style-btn active" data-style="cinematic">🎬 <span>电影感</span></button>
          <button class="style-btn" data-style="fantasy">🧙 <span>奇幻</span></button>
          <button class="style-btn" data-style="scifi">🚀 <span>科幻</span></button>
          <button class="style-btn" data-style="anime">⛩️ <span>动漫</span></button>
          <button class="style-btn" data-style="noir">🕵️ <span>黑色电影</span></button>
          <button class="style-btn" data-style="horror">👻 <span>恐怖</span></button>
          <button class="style-btn" data-style="romance">💕 <span>浪漫</span></button>
          <button class="style-btn" data-style="comedy">😂 <span>喜剧</span></button>
          <button class="style-btn" data-style="adventure">🗺️ <span>冒险</span></button>
          <button class="style-btn" data-style="documentary">📹 <span>纪录片</span></button>
          <button class="style-btn" data-style="custom">✏️ <span>自定义</span></button>
        </div>
        <input type="text" id="customStyleInput" class="custom-style-input hidden" placeholder="描述你想要的风格...">
      </div>
      <div class="upload-slots upload-slots-single" id="uploadSlots">
        <div class="upload-slot" id="slotPromptFile" data-slot="promptFile">
          <div class="slot-icon">📄</div>
          <div class="slot-label" data-i18n="ui.slotPromptFile">提示词文件</div>
          <div class="slot-hint" data-i18n="ui.slotPromptFileHint">点击或拖拽上传 .docx / .txt / .md（最多 1 个）</div>
          <input type="file" class="slot-file-input" id="inputPromptFile" accept=".docx,.txt,.md,.markdown">
          <div class="slot-preview hidden" id="previewPromptFile"></div>
        </div>
      </div>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="auto" id="modeAuto">
        <div class="mode-label">🚀 Auto Pilot</div>
        <div class="mode-desc">Sit back and watch the magic unfold</div>
      </button>
      <button class="mode-btn" data-mode="interactive" id="modeInteractive">
        <div class="mode-label">🤝 Co-Create</div>
        <div class="mode-desc">Collaborate step by step, your vision matters</div>
      </button>
    </div>
    <button class="start-btn" id="startBtn">
      <span class="shimmer"></span>
      ✨ Lights, Camera, Action!
    </button>
  </div>

  <!-- Pipeline Section -->
  <div class="section hidden" id="pipelineSection">
    <div class="pipeline" id="pipeline"></div>
    <div id="stepContent"></div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <h2 id="settingsTitle">AI Model Settings</h2>
        <button id="settingsClose" class="modal-close">&times;</button>
      </div>

      <!-- Module 1: API Settings -->
      <div class="modal-section-title" id="apiSettingsTitle">API Settings</div>

      <div class="api-provider-row" data-provider="openai">
        <span class="api-provider-name">OpenAI</span>
        <input type="text" class="api-endpoint" data-p="openai" placeholder="https://api.openai.com/v1">
        <div class="input-with-toggle">
          <input type="password" class="api-key" data-p="openai" placeholder="API Key">
          <button class="toggle-vis-btn" type="button" data-target="openai">👁</button>
        </div>
      </div>

      <div class="api-provider-row" data-provider="deepseek">
        <span class="api-provider-name">DeepSeek</span>
        <input type="text" class="api-endpoint" data-p="deepseek" placeholder="https://api.deepseek.com/v1">
        <div class="input-with-toggle">
          <input type="password" class="api-key" data-p="deepseek" placeholder="API Key">
          <button class="toggle-vis-btn" type="button" data-target="deepseek">👁</button>
        </div>
      </div>

      <div class="api-provider-row" data-provider="dashscope">
        <span class="api-provider-name">DashScope</span>
        <input type="text" class="api-endpoint" data-p="dashscope" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1">
        <div class="input-with-toggle">
          <input type="password" class="api-key" data-p="dashscope" placeholder="API Key">
          <button class="toggle-vis-btn" type="button" data-target="dashscope">👁</button>
        </div>
      </div>

      <div class="api-provider-row" data-provider="ark">
        <span class="api-provider-name">ARK</span>
        <input type="text" class="api-endpoint" data-p="ark" placeholder="https://ark.cn-beijing.volces.com/api/v3">
        <div class="input-with-toggle">
          <input type="password" class="api-key" data-p="ark" placeholder="API Key">
          <button class="toggle-vis-btn" type="button" data-target="ark">👁</button>
        </div>
      </div>

      <div class="api-provider-row" data-provider="kling">
        <span class="api-provider-name">Kling</span>
        <input type="text" class="api-endpoint" data-p="kling" placeholder="https://api.klingai.com">
        <div class="input-with-toggle">
          <input type="password" class="api-key" data-p="kling" placeholder="API Key">
          <button class="toggle-vis-btn" type="button" data-target="kling">👁</button>
        </div>
      </div>

      <div class="api-provider-row" data-provider="gemini">
        <span class="api-provider-name">Gemini</span>
        <input type="text" class="api-endpoint" data-p="gemini" placeholder="https://generativelanguage.googleapis.com/v1beta/openai">
        <div class="input-with-toggle">
          <input type="password" class="api-key" data-p="gemini" placeholder="API Key">
          <button class="toggle-vis-btn" type="button" data-target="gemini">👁</button>
        </div>
      </div>

      <div class="modal-divider"></div>

      <!-- Module: ComfyUI SSH Connection -->
      <div class="modal-section-title">ComfyUI (DGX Spark)</div>

      <div class="comfy-ssh-grid">
        <div class="modal-field">
          <label>SSH Host</label>
          <input type="text" id="comfySshHost" placeholder="106.13.186.155">
        </div>
        <div class="modal-field">
          <label>SSH Port</label>
          <input type="number" id="comfySshPort" placeholder="6078">
        </div>
        <div class="modal-field">
          <label>Username</label>
          <input type="text" id="comfySshUser" placeholder="Developer">
        </div>
        <div class="modal-field">
          <label>ComfyUI Port</label>
          <input type="number" id="comfySshComfyPort" placeholder="8188">
        </div>
      </div>
      <div class="modal-field modal-field-row">
        <label>Enable Lightning LoRA (faster, fewer steps)</label>
        <label class="toggle-switch">
          <input type="checkbox" id="comfyEnableLightning">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="modal-divider"></div>

      <!-- Module 2: Model Selection -->
      <div class="modal-section-title" id="modelSelectionTitle">Model Selection</div>

      <div class="model-select-group">
        <label id="lblTextModel">Text &amp; Evaluation Model <span class="model-hint" id="textModelHint">(for script, storyboard &amp; media scoring)</span></label>
        <select id="cfgTextModel" class="model-select"></select>
        <div class="model-custom-wrap hidden" id="textModelCustomWrap">
          <input type="text" id="cfgTextModelCustom" class="model-custom-input" placeholder="Model name...">
        </div>
      </div>

      <div class="model-select-group">
        <label id="lblImageModel">Text-to-Image Model</label>
        <select id="cfgImageModel" class="model-select"></select>
        <div class="model-custom-wrap hidden" id="imageModelCustomWrap">
          <input type="text" id="cfgImageModelCustom" class="model-custom-input" placeholder="Model name...">
        </div>
      </div>

      <div class="model-select-group">
        <label id="lblImg2ImgModel">Image-to-Image Model</label>
        <select id="cfgImg2ImgModel" class="model-select"></select>
        <div class="model-custom-wrap hidden" id="img2imgModelCustomWrap">
          <input type="text" id="cfgImg2ImgModelCustom" class="model-custom-input" placeholder="Model name...">
        </div>
      </div>

      <div class="model-select-group">
        <label id="lblVideoMode">Video Generation Mode</label>
        <select id="cfgVideoMode" class="model-select"></select>
      </div>

      <div class="model-select-group">
        <label id="lblVideoModeModel">First-Frame Video Model</label>
        <select id="cfgVideoModeModel" class="model-select"></select>
        <div class="model-custom-wrap hidden" id="videoModeModelCustomWrap">
          <input type="text" id="cfgVideoModeModelCustom" class="model-custom-input" placeholder="Model name...">
        </div>
      </div>

      <div class="modal-divider"></div>

      <div class="modal-field modal-field-row">
        <label id="lblJsonMode">JSON Mode</label>
        <label class="toggle-switch">
          <input type="checkbox" id="cfgJsonMode" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="modal-field modal-field-row">
        <label id="lblProxy">Use Proxy Server</label>
        <label class="toggle-switch">
          <input type="checkbox" id="cfgProxy">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="modal-actions">
        <button id="testConnBtn" class="action-btn" type="button">
          <span id="testConnText">Test Connection</span>
        </button>
        <button id="saveSettingsBtn" class="action-btn primary" type="button">
          <span id="saveSettingsText">Save</span>
        </button>
      </div>
      <div id="settingsStatus" class="settings-status"></div>
    </div>
  </div>
</div>

<script type="module" src="/src/js/main.js"></script>
</body>
</html>
